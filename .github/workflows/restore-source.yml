name: Restore original Infinity source structure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-source.yml"

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract original source archive
        run: |
          test -f infinity-original-source.zip.zip
          mkdir -p /tmp/infinity-original
          unzip -o infinity-original-source.zip.zip -d /tmp/infinity-original
          cp -a /tmp/infinity-original/. .
          rm -f infinity-original-source.zip.zip
      - name: Commit restored source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore original Infinity source tree"
            git push
          fi
